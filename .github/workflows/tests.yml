name: Validate LioLoto

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, mbstring, zip, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependency versions
        run: |
          composer validate --strict
          composer install --prefer-dist --no-interaction --no-progress
          npm ci --no-fund
      - name: Check security advisories
        run: |
          composer audit --locked
          npm audit
      - name: Build frontend
        run: npm run build
      - name: Check game animation transitions
        run: npm test
      - name: Exercise security and database lifecycle
        run: php artisan test
      - name: Check fresh setup and repeat setup
        run: |
          php scripts/manage.php setup --skip-install --skip-build
          php scripts/manage.php setup --skip-install --skip-build
          php artisan view:cache
